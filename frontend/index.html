<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель конвейера</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Подсчёт деталей на конвейере</h1>
  <div class="muted" id="model">модель загружается…</div>
</header>

<main>
  <section class="card video-card">
    <img id="stream" src="/video" alt="Видео с камеры">
    <div class="video-foot">
      <span id="cam-state" class="pill">камера: —</span>
      <span class="muted" id="fps">—</span>
      <span class="muted" id="tracked">—</span>
    </div>
  </section>

  <aside>
    <section class="card">
      <h2>Лента</h2>
      <div class="row">
        <span id="belt-state" class="pill">—</span>
        <span class="muted" id="port"></span>
      </div>
      <label for="speed">Скорость (1–300)</label>
      <input id="speed" type="number" value="50" min="1" max="300" step="5">
      <div class="row buttons">
        <button id="start" class="primary">Запуск</button>
        <button id="stop">Стоп</button>
      </div>
      <p id="belt-error" class="error" hidden></p>
      <p class="muted small">
        Подсчёт не сбрасывается при остановке и повторном запуске.
        Для нового прогона нажмите «Сброс счётчиков».
      </p>
    </section>

    <section class="card">
      <h2>Счётчики</h2>
      <table id="counts"></table>
      <div class="total">
        <span>Всего</span>
        <strong id="total">0</strong>
      </div>
      <button id="reset" class="danger">Сброс счётчиков</button>
    </section>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
